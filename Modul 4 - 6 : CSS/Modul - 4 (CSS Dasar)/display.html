<!doctype html>
<html>
  <head>
    <title>Pengaturan Display</title>
    <style>
      div {
        border: 1px solid;
        margin: 0 auto;
        height: 100px;
        width: 500px;
        background: skyblue;
      }
      span {
        display: block;
        background: red;
        color: white; /* Tambahan agar teks lebih mudah dibaca */
      }
    </style>
  </head>
  <body>
    <div>Ini adalah elemen pertama menggunakan DIV</div>
    <div>
      Ini DIV di dalam DIV namun membuat elemen blok baru
      <span
        >Ini SPAN di dalam DIV tidak membuat elemen blok baru (telah diubah
        menjadi block)</span
      >
    </div>
  </body>
</html>
