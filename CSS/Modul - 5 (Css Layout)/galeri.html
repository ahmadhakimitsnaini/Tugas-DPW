<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Galeri Foto Flexbox</title>
    <style>
        .gallery-container {
            display: flex;
            flex-wrap: wrap; /* Mengizinkan foto turun ke baris bawah */
            gap: 15px; /* Memberi jarak antar foto */
            justify-content: center; /* Menengahkan sisa foto di baris terakhir */
            padding: 20px;
        }

        .gallery-item {
            /* Lebar diatur 25% (4 kolom) dikurangi ukuran gap agar pas */
            width: calc(25% - 15px);
            background-color: #f0f0f0;
            border: 2px solid #ccc;
            box-sizing: border-box;
            text-align: center;
        }

        /* Memastikan gambar tidak melebihi kotak */
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Galeri Foto (18 Item, 4 Kolom)</h2>

    <div class="gallery-container">
        <div class="gallery-item"><img src="image/foto1.jpg" alt="Foto 1"><p>Foto 1</p></div>
        <div class="gallery-item"><img src="image/foto2.jpg" alt="Foto 2"><p>Foto 2</p></div>
        <div class="gallery-item"><img src="image/foto3.jpg" alt="Foto 3"><p>Foto 3</p></div>
