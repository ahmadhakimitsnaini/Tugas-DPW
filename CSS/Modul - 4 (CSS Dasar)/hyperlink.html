<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pengaturan pada link</title>
    <style type="text/css">
        /* Mengatur tampilan link pada kondisi normal / belum diklik */
        a:link {
            text-decoration: none;
            background-color: #FF9933;
            color: #FFFFFF;
        }
        
        /* Mengatur tampilan link saat sedang diklik (ditahan) */
        a:active {
            text-decoration: none;
            color: #660000;
        }
        
        /* Mengatur tampilan link setelah pernah dikunjungi */
        a:visited {
            text-decoration: none;
            color: #222;
        }
        
        /* Mengatur tampilan link saat kursor mouse diarahkan ke atasnya */
        a:hover {
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: underline overline;
            color: #000000;
            background-color: #CCFF00;
        }
    </style>
</head>
<body>
    <table border="0">
        <tr>
            <td><a href="#">Arahkan mouse ke sini</a></td>
        </tr>
        <tr>
            <td><a href="#">Arahkan mouse ke sini</a></td>
        </tr>
    </table>
</body>
</html>
